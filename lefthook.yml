pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,ts,vue,mjs}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{js,ts,vue,mjs,json,md,css,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
